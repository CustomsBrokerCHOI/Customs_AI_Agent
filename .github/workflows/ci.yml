name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit + integration tests (mocked DB)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # 테스트는 실 API 호출 없이 동작해야 함
      ANTHROPIC_API_KEY: ""
      OPENAI_API_KEY: ""
      UNIPASS_API_KEY: test-unused
      JWT_SECRET: test-secret-at-least-32-chars-long-abcdef
      ENV: test
      # DB 는 mock override 로 커버되므로 URL 은 존재하기만 하면 됨
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/customs_test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r api/requirements.txt
          pip install 'pydantic[email]' aiosqlite

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

  security:
    name: Dependency + code security scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true  # 경고는 먼저 수집만, 병합 차단은 별도 정책

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install audit tools
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit bandit

      - name: pip-audit (known CVE 스캔)
        run: |
          pip install -r requirements.txt -r api/requirements.txt
          pip-audit --desc --strict || true

      - name: bandit (정적 분석)
        run: bandit -r api/ scripts/ -ll -x tests,api/alembic || true

  lint:
    name: Format / lint check (informational)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install ruff
        run: pip install ruff
      - name: ruff check
        run: ruff check api/ scripts/ tests/ || true
