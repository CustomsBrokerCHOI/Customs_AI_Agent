# 통합 테스트용 Postgres+pgvector. 일반 개발 DB (5432) 와 겹치지 않도록 5433 사용.
#
# 사용법:
#   docker compose -f docker-compose.test.yml up -d
#   export TEST_DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5433/customs_test
#   python -m pytest tests/integration_db/ -v
#   docker compose -f docker-compose.test.yml down -v   # 종료 + 볼륨 삭제

services:
  postgres-test:
    image: pgvector/pgvector:pg16
    container_name: customs-pg-test
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: customs_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    # 테스트 DB 는 영속 불필요 — 컨테이너 내부 스토리지만 사용 (volume 선언 안 함)
